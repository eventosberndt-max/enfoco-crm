<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Enfoco · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0f12; --card:#17181d; --card2:#1d1f26; --line:#262933;
  --tx:#e8e6e1; --tx2:#9a9890; --gold:#d4b46a;
  --ex:#d4b46a; --cal:#e0704f; --tib:#dfa93d; --fri:#5f8dd3;
  --ok:#57b46a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:60px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{padding:calc(env(safe-area-inset-top,0px) + 18px) 0 10px}
.brand{font-family:'Fraunces',serif;font-style:italic;font-size:1.45rem;color:var(--gold)}
.sub{color:var(--tx2);font-size:.8rem;margin-top:2px}
.stats{display:flex;gap:8px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--tx2);
  border-radius:20px;padding:8px 14px;font-size:.82rem;font-weight:600;cursor:pointer;user-select:none}
.chip .n{color:var(--tx);margin-left:5px}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(212,180,106,.08)}
.search{width:100%;margin:10px 0 2px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--tx);font-size:16px;outline:none}
.search::placeholder{color:var(--tx2)}
.sec{margin-top:18px}
.sec h2{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tx2);
  margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec h2 .cnt{background:var(--card2);border-radius:10px;padding:1px 8px;color:var(--tx)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;
  border-left:3px solid var(--line)}
.card.t-ex{border-left-color:var(--ex)}
.card.t-caliente{border-left-color:var(--cal)}
.card.t-tibio{border-left-color:var(--tib)}
.card.t-frio{border-left-color:var(--fri)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.emp{font-weight:700;font-size:1rem;line-height:1.25}
.con{color:var(--tx2);font-size:.85rem;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.b{font-size:.7rem;font-weight:700;border-radius:8px;padding:3px 8px;letter-spacing:.03em}
.b.ex{background:rgba(212,180,106,.14);color:var(--ex)}
.b.caliente{background:rgba(224,112,79,.14);color:var(--cal)}
.b.tibio{background:rgba(223,169,61,.14);color:var(--tib)}
.b.frio{background:rgba(95,141,211,.14);color:var(--fri)}
.b.late{background:rgba(224,112,79,.12);color:#e58f74}
.b.today{background:rgba(87,180,106,.14);color:var(--ok)}
.b.resp{background:rgba(87,180,106,.2);color:var(--ok)}
.note{margin-top:10px;background:var(--card2);border-radius:10px;padding:10px 12px;font-size:.86rem;
  color:var(--tx);line-height:1.45;white-space:pre-wrap;word-break:break-word}
.note.small{color:var(--tx2);font-size:.8rem}
.lbl{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);margin:10px 0 4px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1 1 auto;min-width:90px;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 10px;border-radius:11px;border:1px solid var(--line);background:var(--card2);
  color:var(--tx);font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn:active{transform:scale(.97)}
.btn.wa{background:rgba(87,180,106,.12);border-color:rgba(87,180,106,.3);color:#7ed194}
.btn.done{background:rgba(212,180,106,.1);border-color:rgba(212,180,106,.3);color:var(--gold)}
.btn.copied{background:rgba(87,180,106,.2);color:var(--ok)}
.empty{color:var(--tx2);text-align:center;padding:40px 10px;font-size:.9rem}
.foot{color:var(--tx2);text-align:center;font-size:.75rem;margin-top:26px}
.reload{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:48px;height:48px;
  border-radius:50%;background:var(--gold);color:#111;border:none;font-size:1.2rem;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.5)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);
  background:#23252c;border:1px solid var(--line);color:var(--tx);padding:10px 18px;border-radius:12px;
  font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Enfoco Films</div>
    <div class="sub" id="sub">Panel de seguimientos</div>
  </header>

  <div class="stats" id="chips"></div>
  <input class="search" id="q" type="search" placeholder="Buscar empresa o contacto…">

  <div id="content"></div>
  <div class="foot">Panel Enfoco · se actualiza desde el CRM en vivo</div>
</div>

<button class="reload" id="reload" title="Actualizar">⟳</button>
<div class="toast" id="toast"></div>

<script>
const DB='https://enfoco-crm-default-rtdb.firebaseio.com/leads';
const TEMPS={ex:{label:'EX-CLIENTE',order:0,next:75},caliente:{label:'CALIENTE',order:1,next:10},
  tibio:{label:'TIBIO',order:2,next:21},frio:{label:'FRÍO',order:3,next:30}};
let LEADS={}, filter='cola', query='';

const $=s=>document.querySelector(s);
const todayISO=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Argentina/Buenos_Aires'});
const norm=s=>(s||'').toString().trim().toLowerCase();
const active=l=>norm(l.origen)!=='cliente'&&!['perdido','no-potencial'].includes(norm(l.estado));
const days=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5);

function phone(w){
  let d=(w||'').replace(/\D/g,'');
  if(!d||d.length<8) return '';
  if(d.startsWith('549')) return d;
  if(d.startsWith('54')) return '549'+d.slice(2);
  if(d.length===10&&(d.startsWith('11')||d.startsWith('2')||d.startsWith('3'))) return '549'+d;
  return d; // internacional (US, BR, etc.)
}
function lastHist(l){
  if(!Array.isArray(l.historial)||!l.historial.length) return '';
  const h=l.historial[l.historial.length-1];
  return (h.contenido||h.texto||'').toString();
}
function temp(l){ return TEMPS[l.temp]?l.temp:'frio'; }

async function load(){
  $('#sub').textContent='Cargando…';
  try{
    LEADS=await fetch(DB+'.json').then(r=>r.json())||{};
    render();
  }catch(e){ $('#sub').textContent='Error de conexión — reintentá'; }
}

function counts(){
  const t=todayISO();
  const c={cola:0,ex:0,caliente:0,tibio:0,frio:0};
  for(const l of Object.values(LEADS)){
    if(!active(l)) continue;
    c[temp(l)]++;
    const pf=(l.proxFecha||'').slice(0,10);
    if(/^\d{4}-\d{2}-\d{2}$/.test(pf)&&pf<=t) c.cola++;
  }
  return c;
}

function chipRow(){
  const c=counts();
  const defs=[['cola','📥 Cola',c.cola],['ex','EX',c.ex],['caliente','Calientes',c.caliente],
    ['tibio','Tibios',c.tibio],['frio','Fríos',c.frio],['todos','Todos',c.ex+c.caliente+c.tibio+c.frio]];
  $('#chips').innerHTML=defs.map(([k,lb,n])=>
    `<div class="chip ${filter===k?'on':''}" data-f="${k}">${lb}<span class="n">${n}</span></div>`).join('');
  document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{filter=ch.dataset.f;render();});
}

function matches(l){
  if(!query) return true;
  return (norm(l.empresa)+' '+norm(l.contacto)).includes(query);
}

function cardHTML(k,l){
  const t=todayISO(), tp=temp(l), pf=(l.proxFecha||'').slice(0,10);
  const late=/^\d{4}-\d{2}-\d{2}$/.test(pf)?days(t,pf):null;
  let when='';
  if(late!==null){
    if(late>0) when=`<span class="b late">${late} día${late>1?'s':''} atrasado</span>`;
    else if(late===0) when=`<span class="b today">HOY</span>`;
    else when=`<span class="b" style="color:var(--tx2)">próx ${pf.slice(8,10)}/${pf.slice(5,7)}</span>`;
  } else when='<span class="b late">SIN FECHA</span>';
  const draft=(l.borrador||'').trim();
  const paso=(l.proxPaso||'').trim();
  const hist=lastHist(l);
  const ph=phone(l.wpp);
  const waTxt=draft?('&text='+encodeURIComponent(draft)):'';
  const mail=(l.mail||'').split('//')[0].trim();
  return `<div class="card t-${tp}" data-k="${k}">
    <div class="top"><div><div class="emp">${l.empresa||'—'}</div><div class="con">${l.contacto||''}</div></div></div>
    <div class="badges"><span class="b ${tp}">${TEMPS[tp].label}</span>${when}</div>
    ${draft?`<div class="lbl">Borrador listo</div><div class="note">${draft}</div>`:''}
    ${!draft&&paso?`<div class="lbl">Próximo paso</div><div class="note small">${paso}</div>`:''}
    ${hist?`<div class="lbl">Último contacto</div><div class="note small">${hist.slice(0,220)}${hist.length>220?'…':''}</div>`:''}
    <div class="acts">
      ${draft?`<button class="btn" data-copy="${k}">📋 Copiar</button>`:''}
      ${ph?`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${ph}${waTxt}">WhatsApp</a>`:''}
      ${mail?`<a class="btn" href="mailto:${mail}">✉️ Mail</a>`:''}
      <button class="btn done" data-done="${k}">✓ Enviado</button>
    </div>
  </div>`;
}

function render(){
  chipRow();
  const t=todayISO();
  const list=Object.entries(LEADS).filter(([k,l])=>active(l)&&matches(l));
  let out='';
  if(filter==='cola'){
    const cola=list.filter(([k,l])=>{const pf=(l.proxFecha||'').slice(0,10);
      return !/^\d{4}-\d{2}-\d{2}$/.test(pf)||pf<=t;})
      .sort((a,b)=>{const oa=TEMPS[temp(a[1])].order,ob=TEMPS[temp(b[1])].order;
        if(oa!==ob) return oa-ob;
        return ((a[1].proxFecha||'9999')<(b[1].proxFecha||'9999'))?-1:1;});
    out=cola.length?cola.map(([k,l])=>cardHTML(k,l)).join('')
      :'<div class="empty">🎉 Nada pendiente en la cola.<br>Todo al día.</div>';
    $('#content').innerHTML=`<div class="sec"><h2>Para enviar <span class="cnt">${cola.length}</span></h2>${out}</div>`;
  } else {
    const groups=filter==='todos'?['ex','caliente','tibio','frio']:[filter];
    $('#content').innerHTML=groups.map(g=>{
      const gl=list.filter(([k,l])=>temp(l)===g)
        .sort((a,b)=>((a[1].proxFecha||'9999')<(b[1].proxFecha||'9999'))?-1:1);
      if(!gl.length) return '';
      return `<div class="sec"><h2>${TEMPS[g].label}S <span class="cnt">${gl.length}</span></h2>${gl.map(([k,l])=>cardHTML(k,l)).join('')}</div>`;
    }).join('')||'<div class="empty">Sin resultados.</div>';
  }
  $('#sub').textContent=t.split('-').reverse().join('/')+' · '+counts().cola+' en cola';
  bindCards();
}

function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1800);}

function bindCards(){
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{
    const l=LEADS[b.dataset.copy];
    try{await navigator.clipboard.writeText(l.borrador||'');b.classList.add('copied');b.textContent='✓ Copiado';
      setTimeout(()=>{b.classList.remove('copied');b.textContent='📋 Copiar';},1500);}
    catch(e){toast('No pude copiar');}
  });
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.done, l=LEADS[k], tp=temp(l);
    if(!confirm('¿Marcar "'+(l.empresa||'')+'" como enviado?')) return;
    const t=todayISO();
    const next=new Date(t+'T00:00:00'); next.setDate(next.getDate()+TEMPS[tp].next);
    const nx=next.toISOString().slice(0,10);
    const hist=Array.isArray(l.historial)?l.historial.slice():[];
    hist.push({fecha:t,contenido:'Enviado desde el panel ('+(l.borrador?'borrador aprobado':'seguimiento')+'). Próxima: '+nx});
    const body={proxFecha:nx,historial:hist,borrador:'',_lastEdit:Date.now()};
    const r=await fetch(DB+'/'+k+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok){Object.assign(l,body);toast('Listo · próxima '+nx.split('-').reverse().join('/'));render();}
    else toast('Error al guardar');
  });
}

$('#q').addEventListener('input',e=>{query=norm(e.target.value);render();});
$('#reload').onclick=load;
load();
</script>
</body>
</html>
